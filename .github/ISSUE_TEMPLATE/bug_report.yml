name: Bug report
description: Report reproducible incorrect behavior in Riddle or its tools.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please include a minimal reproduction.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest Riddle source, manifest, and commands that reproduce the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Paste `riddlec --version` or the commit hash.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, target triple, and C compiler when relevant.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the complete diagnostics or command output.
      render: text
    validations:
      required: true
