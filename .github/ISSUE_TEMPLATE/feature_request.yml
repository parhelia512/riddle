name: Feature request
description: Propose a language, standard-library, compiler, or tooling capability.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete user problem. A missing API by itself is not enough.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Show the intended source syntax, command, API, or workflow.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe existing workarounds or smaller solutions considered.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Language semantics
        - Standard library
        - Compiler or diagnostics
        - Clue
        - LSP or editor integration
        - Runtime or FFI
        - Documentation
    validations:
      required: true
