name: Pull Request

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test --workspace --all-targets

      - name: Check Riddle source formatting
        shell: bash
        run: |
          files=$(git ls-files 'std/**/*.rid')
          if [ -z "$files" ]; then
            echo "no Riddle sources to check"
            exit 0
          fi
          cargo run --quiet -p riddle --features install-bins --bin riddle -- fmt --check $files

      - name: Check installable binaries
        run: cargo check -p riddle --features install-bins --bins

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
