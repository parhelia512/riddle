name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: 检查格式
        run: cargo fmt --all -- --check

      - name: 严格 Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: 验证源码安装构建
        run: cargo build -p riddle --release --locked --features install-bins --bins

      - name: 校验标签、Cargo 版本与发布说明
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "${{ github.ref_name }}" != "v${VERSION}" ]; then
            echo "标签 ${{ github.ref_name }} 与 Cargo 版本 ${VERSION} 不匹配"
            exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md 缺少 ${VERSION} 的发布说明"
            exit 1
          fi

  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            platform: linux

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            platform: linux

          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            arch: i686
            platform: linux
            cross: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            platform: windows

          - os: windows-latest
            target: i686-pc-windows-msvc
            arch: i686
            platform: windows
            cross: true

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: aarch64
            platform: windows
            cross: true

          - os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: 安装 Node.js（仅原生目标）
        if: matrix.cross != true
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 安装交叉编译依赖（Linux i686）
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libssl-dev:i386
          echo "PKG_CONFIG_ALLOW_CROSS_i686_unknown_linux_gnu=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR_i686_unknown_linux_gnu=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: 运行测试（仅原生目标）
        if: matrix.cross != true
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked --target ${{ matrix.target }} 2>&1 | tee test.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            DETAILS=$(tail -n 80 test.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test failure::${DETAILS}"
            exit "$STATUS"
          fi

      - name: Release 构建
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: LSP stdio smoke（仅原生目标）
        if: matrix.cross != true
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/riddle-lsp"
          if [ "${{ matrix.platform }}" = "windows" ]; then BIN="${BIN}.exe"; fi
          node editors/lsp-smoke.mjs "$BIN"

      - name: 打包平台构建产物
        shell: bash
        run: |
          SUFFIX="${{ matrix.platform }}-${{ matrix.arch }}"
          BIN_DIR="target/${{ matrix.target }}/release"

          mkdir -p dist

          for name in clue riddle-lsp riddlec riddle; do
            if [ -f "$BIN_DIR/$name" ]; then
              cp "$BIN_DIR/$name" "dist/$name"
            elif [ -f "$BIN_DIR/$name.exe" ]; then
              cp "$BIN_DIR/$name.exe" "dist/$name.exe"
            else
              echo "Missing binary: $name"
              exit 1
            fi
          done

          cp LICENSE README.md crates/gc/src/runtime.c dist/

          ZIPNAME="riddle-${{ github.ref_name }}-${SUFFIX}.zip"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            powershell -Command "Compress-Archive -Path dist\* -DestinationPath ${ZIPNAME}"
          else
            cd dist && zip "../${ZIPNAME}" * && cd ..
          fi
          ls -lh "${ZIPNAME}"

          rm -rf dist-target
          mkdir -p dist-target
          cp LICENSE crates/gc/src/runtime.c dist-target/
          cat > dist-target/target.toml <<EOF
          schema = 1
          triple = "${{ matrix.target }}"
          runtime = "runtime.c"
          llvm_version = "22.1.3"
          EOF

          TARGET_ZIP="riddle-${{ github.ref_name }}-target-${{ matrix.target }}.zip"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            powershell -Command "Compress-Archive -Path dist-target\* -DestinationPath ${TARGET_ZIP}"
          else
            cd dist-target && zip "../${TARGET_ZIP}" * && cd ..
          fi
          ls -lh "${TARGET_ZIP}"

      - name: 上传 zip
        uses: actions/upload-artifact@v6
        with:
          name: release-zip-${{ matrix.platform }}-${{ matrix.arch }}
          path: riddle-*.zip

  package-editors:
    name: Package editor integrations
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: 安装 JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 打包编辑器扩展
        run: bash editors/package.sh

      - name: 上传编辑器扩展
        uses: actions/upload-artifact@v6
        with:
          name: editor-packages
          path: editors/dist/*

  release:
    name: Publish Release
    needs: [build, package-editors]
    runs-on: ubuntu-latest
    steps:
      - name: 检出发布说明
        uses: actions/checkout@v5

      - name: 下载全部平台 zip
        uses: actions/download-artifact@v7
        with:
          pattern: "{release-zip-*,editor-packages}"
          path: .
          merge-multiple: true

      - name: 生成发行清单
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > riddle-dist.toml <<EOF
          schema = 1
          channel = "stable"
          version = "${VERSION}"
          commit = "${GITHUB_SHA}"
          llvm_version = "22.1.3"
          EOF

          emit_entry() {
            KIND="$1"
            TRIPLE="$2"
            ASSET="$3"
            if [ ! -f "$ASSET" ]; then
              echo "Missing distribution asset: $ASSET"
              exit 1
            fi
            DIGEST=$(sha256sum "$ASSET" | awk '{print $1}')
            cat >> riddle-dist.toml <<EOF

          [[${KIND}]]
          triple = "${TRIPLE}"
          asset = "${ASSET}"
          sha256 = "${DIGEST}"
          EOF
          }

          emit_entry hosts x86_64-unknown-linux-gnu "riddle-${GITHUB_REF_NAME}-linux-x86_64.zip"
          emit_entry hosts aarch64-unknown-linux-gnu "riddle-${GITHUB_REF_NAME}-linux-aarch64.zip"
          emit_entry hosts i686-unknown-linux-gnu "riddle-${GITHUB_REF_NAME}-linux-i686.zip"
          emit_entry hosts x86_64-pc-windows-msvc "riddle-${GITHUB_REF_NAME}-windows-x86_64.zip"
          emit_entry hosts i686-pc-windows-msvc "riddle-${GITHUB_REF_NAME}-windows-i686.zip"
          emit_entry hosts aarch64-pc-windows-msvc "riddle-${GITHUB_REF_NAME}-windows-aarch64.zip"
          emit_entry hosts aarch64-apple-darwin "riddle-${GITHUB_REF_NAME}-macos-aarch64.zip"

          for TRIPLE in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            i686-unknown-linux-gnu \
            x86_64-pc-windows-msvc \
            i686-pc-windows-msvc \
            aarch64-pc-windows-msvc \
            aarch64-apple-darwin
          do
            emit_entry targets "$TRIPLE" "riddle-${GITHUB_REF_NAME}-target-${TRIPLE}.zip"
          done

          cat riddle-dist.toml

      - name: 提取发布说明
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 {
              found = 1
              next
            }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: 创建正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" riddle-*.zip riddle-dist.toml riddle-vscode.vsix \
              --repo "${{ github.repository }}" \
              --clobber
            gh release edit "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "Riddle ${{ github.ref_name }}" \
              --notes-file release-notes.md
          else
            gh release create "${{ github.ref_name }}" riddle-*.zip riddle-dist.toml riddle-vscode.vsix \
              --repo "${{ github.repository }}" \
              --title "Riddle ${{ github.ref_name }}" \
              --notes-file release-notes.md
          fi

  notify:
    name: 通知失败
    needs: [validate, build, release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "正式发布失败！请检查运行日志："
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
