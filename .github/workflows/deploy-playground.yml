name: Deploy Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Playground deployment
        env:
          PLAYGROUND_DISPATCH_TOKEN: ${{ secrets.PLAYGROUND_DISPATCH_TOKEN }}
        run: |
          if [ -z "$PLAYGROUND_DISPATCH_TOKEN" ]; then
            echo "::error::PLAYGROUND_DISPATCH_TOKEN is not configured"
            exit 1
          fi
          curl --fail-with-body --request POST \
            --url https://api.github.com/repos/riddle-lang/playground/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $PLAYGROUND_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data "{\"event_type\":\"riddle-main-updated\",\"client_payload\":{\"riddle_sha\":\"$GITHUB_SHA\"}}"
