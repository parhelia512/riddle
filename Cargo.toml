[workspace]
resolver = "2"
members = [
    "app/clue",
    "app/riddle-lsp",
    "app/riddlec",
    "crates/ast",
    "crates/escape-analysis",
    "crates/frontend",
    "crates/gc",
    "crates/hir",
    "crates/mir",
    "crates/move-checker",
    "crates/scope-graph",
    "crates/syntax",
    "crates/ty",
    "crates/type-checker",
]
default-members = [
    ".",
    "app/clue",
    "app/riddle-lsp",
    "app/riddlec",
    "crates/ast",
    "crates/escape-analysis",
    "crates/frontend",
    "crates/gc",
    "crates/hir",
    "crates/mir",
    "crates/move-checker",
    "crates/scope-graph",
    "crates/syntax",
    "crates/ty",
    "crates/type-checker",
]

[workspace.package]
version = "0.2.1"
edition = "2024"

[package]
name = "riddle"
version.workspace = true
edition.workspace = true
publish = false
autotests = false

[dependencies]
clap = { version = "=4.5.61", features = ["derive", "string"] }
clue = { path = "app/clue" }
mir = { path = "crates/mir" }
riddlec = { path = "app/riddlec" }
riddle-lsp = { path = "app/riddle-lsp" }
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }

[features]
install-bins = []

[[bin]]
name = "clue"
path = "app/clue/src/main.rs"
required-features = ["install-bins"]

[[bin]]
name = "riddle-lsp"
path = "app/riddle-lsp/src/main.rs"
required-features = ["install-bins"]

[[bin]]
name = "riddlec"
path = "app/riddlec/src/main.rs"
required-features = ["install-bins"]

[dev-dependencies]
ast = { path = "crates/ast" }
escape-analysis = { path = "crates/escape-analysis" }
frontend = { path = "crates/frontend" }
hir = { path = "crates/hir" }
lsp-types = "0.94.1"
mir = { path = "crates/mir" }
move-checker = { path = "crates/move-checker" }
riddle-lsp = { path = "app/riddle-lsp", features = ["test"] }
rowan = "0.16.1"
scope-graph = { path = "crates/scope-graph" }
tower-lsp = "0.20.0"
type-checker = { path = "crates/type-checker" }

[[test]]
# Cross-crate compiler integration suites owned by the root package.
name = "mir"
path = "tests/mir/main.rs"

[[test]]
name = "move_checker"
path = "tests/move_checker/main.rs"

[[test]]
name = "riddle_lsp"
path = "tests/riddle_lsp/unit.rs"

[[test]]
name = "scope_graph"
path = "tests/scope_graph/main.rs"

[[test]]
name = "type_checker"
path = "tests/type_checker/main.rs"
