[package]
name = "clue"
version.workspace = true
edition.workspace = true
publish = false
autotests = false

[dependencies]
anyhow = "1.0"
ast = { path = "../../crates/ast" }
clap = { version = "4.6.4", features = ["derive"] }
frontend = { path = "../../crates/frontend" }
gc = { path = "../../crates/gc" }
riddlec = { path = "../riddlec" }
rowan = "0.16.1"
serde = { version = "1", features = ["derive"] }
toml = "1"
type-checker = { path = "../../crates/type-checker" }

[[test]]
# Clue integration suites live in the workspace tests/ tree.
name = "commands"
path = "../../tests/clue/commands.rs"

[[test]]
name = "project_session"
path = "../../tests/clue/project_session.rs"
