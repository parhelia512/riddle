[package]
name = "clue"
version.workspace = true
edition.workspace = true
publish = false
autotests = false

[dependencies]
anyhow = "1.0"
ast = { path = "../../crates/ast" }
clap = { version = "=4.5.61", features = ["derive"] }
ctrlc = "3.4"
flate2 = "1"
frontend = { path = "../../crates/frontend" }
gc = { path = "../../crates/gc" }
ignore = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "native-tls-no-alpn"] }
riddlec = { path = "../riddlec" }
rowan = "0.16.1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "1"
toml_edit = "0.24"
type-checker = { path = "../../crates/type-checker" }

[[test]]
# Clue integration suites live in the workspace tests/ tree.
name = "commands"
path = "../../tests/clue/commands.rs"

[[test]]
name = "project_session"
path = "../../tests/clue/project_session.rs"
